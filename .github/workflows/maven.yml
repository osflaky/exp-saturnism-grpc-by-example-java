name: Java CI

on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-18.04
    strategy:
      matrix:
        include:
        - java_version: 12
          expander_leg: ubuntu-18.04-12-x64
      fail-fast: false

    steps:
    - uses: actions/checkout@v1
    - name: Set up JDK
      uses: actions/setup-java@v1
      with:
        java-version: ${{ matrix.java_version }}
    - name: Build with Maven
      run: ./mvnw -B package verify
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
